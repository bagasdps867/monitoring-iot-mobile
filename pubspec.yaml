  pdf: ^3.11.1
  printing: ^5.11.1
  docx_template: ^0.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/alarm_tet.wav
    - assets/logo.png